<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deck - VTCG</title>
    <link rel="stylesheet" href="./css/global.css">

<body>
    <header class="dashboard-header">
        <a href="/dashboard.html" class="logo">VTCG</a>

    <nav class="main-nav">
