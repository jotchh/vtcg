<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VTCG - Virtual Trading Card Game</title>
    <link rel="stylesheet" href="./css/global.css">
    <link rel="stylesheet" href="./css/index.css">
</head>

<body>
    <header class="landing-header">
        <a href="/" class="landing-logo">VTCG</a>

        <nav class="landing-nav">
            <a href="/search.html">Browse Cards</a>
            <a href="/login.html" class="login-link">Login</a>
            <a href="/register.html" class="register-link">Get Started</a>
        </nav>
    </header>

    <main>
        <section class="hero">
            <div class="hero-content">
                <h1>
                    Let's larp...
                    <span>together.</span>
                </h1>

                <p class="hero-description">
                    VTCG is a virtual trading card platform where you can
                    discover cards, open packs, build your collection, and
                    trade with other players.
                </p>

                <div class="hero-actions">
                    <a href="/register.html" class="primary-button">
                        Start Collecting
                    </a>

                    <a href="/search.html" class="secondary-button">
                        Explore Cards
                    </a>
                </div>
            </div>

            <div class="hero-visual">
                <div class="floating-card card-one">
                    <div class="card-placeholder">VTCG</div>
                </div>

                <div class="floating-card card-two">
                    <div class="card-placeholder">VTCG</div>
                </div>

                <div class="floating-card card-three">
                    <div class="card-placeholder">VTCG</div>
                </div>
            </div>
        </section>
    </main>

    <footer class="landing-footer">
        <span>VTCG</span>
        <span>John WebDev</span>
    </footer>
</body>
</html>
