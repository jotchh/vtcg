<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VTCG - Login</title>
    <link rel="stylesheet" href="./css/global.css">
    <link rel="stylesheet" href="./css/form.css">
</head>

<body>
    <main class="auth-page">
        <section class="auth-card">
            <div class="auth-header">
                <a href="/dashboard.html" class="auth-logo">VTCG</a>
                <h1>Login to VTCG</h1>
            </div>

        <div class="form-error" id="error-msg"></div>

        <form action="/auth/login" method="POST" class="auth-form" id="login-form">

            <div class="form-field">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" maxlength="100" autocomplete="email" required>
                <small class="form-error" id="email-error"></small>
            </div>

            <div class="form-field">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" autocomplete="current-password" required>
                <small class="form-error" id="password-error"></small>
            </div>

            <button type="submit" class="auth-button">
                Login
            </button>
        </form>

        <div class="auth-footer">
            <span>Don't have an account?</span>
            <a href="/register.html">Register here</a>
        </div>
    </section>
</main>
<script src="./js/login.js"></script>
</body>
</html>
