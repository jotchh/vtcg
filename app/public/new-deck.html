<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Deck - VTCG</title>
    <link rel="stylesheet" href="./css/global.css">
    <link rel="stylesheet" href="./css/search.css">
    <link rel="stylesheet" href="./css/decks.css">
</head>

<body>
    <header class="dashboard-header">
        <a href="/dashboard.html" class="logo">VTCG</a>

    <nav class="main-nav">
        <a href="/packs.html">Packs</a>
        <a href="/search.html">Cards</a>
        <a href="/collections.html">Collection</a>
        <a href="/trade-dashboard.html">Trades</a>

    </nav>

    <div class="user-menu">
        <span id="username"></span>
        <a href="/login.html" id="auth-link">Login</a>
    </div>
</header>

<main class="search-page">
    <a href="./decks.html" class="back-link">&larr; Back to Decks</a>

    <section class="page-header">
        <p class="eyebrow">Deck Builder</p>
        <h1>New Deck</h1>
        <p>Create a new deck to start building.</p>

    <form id="new-deck-form" class="search-controls">
        <div class="search-field">
            <label for="deck-name">Deck Name</label>
            <input type="text" id="deck-name" required>
        </div>

        <button type="submit">Create Deck</button>
    </form>

    <p id="status-message" class="hint"></p>
</main>

<script src="./js/global.js"></script>
<script src="./js/new-deck.js"></script>
