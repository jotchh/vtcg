<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Deck - VTCG</title>
    <link rel="stylesheet" href="css/decks.css">
</head>
<body>
    <nav>
        <a href="index.html">Home</a>
        <a href="decks.html">Decks</a>
        <a href="wishlist.html">Wishlist</a>
    </nav>

    <h1>New Deck</h1>

    <form id="new-deck-form">
        <div>
            <label for="deck-name">Deck Name</label><br>
            <input type="text" id="deck-name" required>
        </div>
        <br>
        <div>
            <label for="deck-type">Deck Type</label><br>
            <select id="deck-type">
                <option value="TRUE">True Deck (cards you own)</option>
                <option value="WISHLIST">Wishlist Deck (cards you want)</option>
            </select>
        </div>
        <br>
        <button type="submit">Create Deck</button>
    </form>

    <p id="status-message" class="hint"></p>
</body>
<script src="js/new-deck.js"></script>
</html>
