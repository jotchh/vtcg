<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VTCG - Packs</title>

    <link rel="stylesheet" href="./css/global.css">
    <link rel="stylesheet" href="./css/search.css">
    <link rel="stylesheet" href="./css/packs.css">
</head>

<body>

<header class="dashboard-header">

    <a href="/dashboard.html" class="logo">
        VTCG
    </a>

    <nav class="main-nav">
        <a href="/packs.html">Packs</a>
        <a href="/search.html">Cards</a>
        <a href="/collections.html">Collection</a>
        <a href="/trade-dashboard.html">Trades</a>
        <a href="/decks.html">Deck Builder</a>
        <a href="/wishlist.html">Wishlist</a>
    </nav>

    <div class="user-menu">
        <span id="username"></span>
        <a href="/login.html" id="auth-link">Login</a>
    </div>

</header>

<main class="search-page">
    <section class="page-header">
        <p class="eyebrow">Card Packs</p>
        <h1>Packs</h1>
        <p>Open a pack to pull new cards.</p>
    </section>

    <p id="opens-remaining"></p>

    <form id="open-form" class="search-controls">

        <div class="search-field">
            <label for="game-select">Game</label>
            <select id="game-select"></select>
        </div>

        <div class="search-field">
            <label for="set-select">Set</label>
            <select id="set-select"></select>
        </div>

        <button type="submit" id="open-btn" class="pack-btn">Open Pack</button>
    </form>
    
    <section class="scrap-section">
        <div class="page-header">
            <h2>Out of packs?</h2>
            <p>Scrap <span id="scrap-cost">10</span> cards from your collection to open another pack!</p>
        </div>

        <button type="button" id="scrap-toggle-btn" class="pack-btn">Scrap Cards</button>

        <div id="scrap-panel" hidden>
            <p id="scrap-selection-info">0 / 10 selected</p>
            <div id="scrap-card-list" class="scrap-grid"></div>
            <button type="button" id="scrap-confirm-btn" class="pack-btn" disabled>Scrap 10 &amp; Open Pack</button>
        </div>
    </section>

    <p id="status-message" class="query-message"></p>

    <div id="pack-opening" class="pack-opening hidden">
        <div id="pack" class="pack">
            <div class="pack-logo">
                VTCG
            </div>
            <div id="pack-set-name" class="pack-set"></div>
        </div>
        <div id="pack-flash"></div>
        <div id="card-reveal" class="card-reveal"></div>
    </div>

    <table id="results-table" class="hidden">

        <thead>
            <tr>
                <th>Name</th>
                <th>Set</th>
                <th>Rarity</th>
                <th>Card Art</th>
            </tr>
        </thead>

        <tbody id="pulled-cards"></tbody>

    </table>

</main>

<script src="./js/global.js"></script>
<script src="./js/packs.js"></script>

</body>
</html>
