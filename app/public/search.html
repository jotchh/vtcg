<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VTCG - Search</title>
    <link rel="stylesheet" href="./css/global.css">
    <link rel="stylesheet" href="./css/search.css">
</head>

<body>
    <header class="dashboard-header">
        <a href="/dashboard.html" class="logo">VTCG</a>

        <nav class="main-nav">
            <a href="/packs.html">Packs</a>
            <a href="/search.html">Cards</a>
            <a href="/collections.html">Collection</a>
            <a href="/trade-dashboard.html">Trades</a>
            <a href="/decks.html">Deck Builder</a>
        </nav>

        <div class="user-menu">
            <span id="username"></span>
            <a href="/login.html" id="auth-link">Login</a>
        </div>
    </header>

    <main class="search-page">
        <section class="page-header">
            <p class="eyebrow">Card Database</p>
            <h1>Search Cards</h1>
            <p>Search for cards across the VTCG database.</p>
        </section>

    <form id="search-form" class="search-controls">
        <div class="search-field">
            <label for="search">Search</label>
            <input type="text" id="search" placeholder="Search by card or set name...">
        </div>

        <div class="search-field">
            <label for="game-select">Game</label>
            <select id="game-select">
                <option value="">All Games</option>
            </select>
        </div>

        <button type="submit" id="submit">Search</button>
    </form>

        <div id="query-message" class="query-message"></div>

        <section id="search-results" class="card-grid"></section>

        <div class="pagination">
            <button id="prev-page">Previous</button>
            <span id="page-info"></span>
            <button id="next-page">Next</button>
        </div>
    </main>

    <script src="./js/global.js"></script>
    <script src="./js/search.js"></script>
</body>
</html>
