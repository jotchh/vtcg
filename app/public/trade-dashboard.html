<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Trades</title>

    <link rel="stylesheet" href="./css/global.css">
    <link rel="stylesheet" href="./css/trade.css">
    <script src="js/global.js"></script>
    <script src="js/trade-dashboard.js" defer></script>
</head>

<body>
    <header class="dashboard-header">
        <a href="/dashboard.html" class="logo">VTCG</a>

        <nav class="main-nav">
            <a href="/packs.html">Packs</a>
            <a href="/search.html">Cards</a>
            <a href="/collections.html">Collection</a>
            <a href="/trade-dashboard.html">Trades</a>
            <a href="/decks.html">Deck Builder</a>
        </nav>

        <div class="user-menu">
            <span id="username"></span>
            <a href="/login.html" id="auth-link">Login</a>
        </div>
    </header>

    <main class="trade-dashboard">
        <h1>Trading Dashboard</h1>

        <section class="start-trade">
            <h2>Start a New Trade</h2>

            <div class="trade-search-options">
                <button id="user-search-button" type="button" class="active">Search by User</button>
                <button id="card-search-button" type="button">Search by Card</button>
            </div>

            <div id="user-search-panel" class="search-panel">
                <label for="user-search">Find a User</label>
                <p class="search-hint">Start typing a username to search for users.</p>
                <input id="user-search" type="search" placeholder="e.g. JohnUsername">
                <div id="user-results" class="search-results"></div>
            </div>

            <div id="card-search-panel" class="search-panel">
                <label for="card-search">Find a Card</label>
                <p class="search-hint">Start typing a card name and/or select a filter to search for tradeable cards.</p>
                <input id="card-search" type="search" placeholder="e.g. Pikachu">

                <div class="card-filters">
                    <select id="game-filter">
                        <option value="">All Games</option>
                    </select>

                    <select id="set-filter">
                        <option value="">All Sets</option>
                    </select>
                </div>

                <div id="card-results" class="listing-results"></div>

                <div id="listing-paging" class="paging">
                    <button id="previous-page" type="button">Previous</button>
                    <span id="page-number">Page 1</span>
                    <button id="next-page" type="button">Next</button>
                </div>
            </div>
        </section>

        <section class="my-trades">
            <h2>My Trades</h2>
            <div class="trade-tabs">
                <button id="incoming-tab" type="button" class="active">Incoming</button>
                <button id="outgoing-tab" type="button">Outgoing</button>
                <button id="completed-tab" type="button">Completed</button>
            </div>

            <div id="trade-list">

            </div>
        </section>
    </main>
</body>
</html>
